<div style="margin: 5px; margin-top: 0px; border-top: 1px solid white; ">
  <p class="text-muted">Prüft XML- und ZIP-Kontoauszüge vor dem Abgleich: Dateiformat, Kontozuordnung, Währung, Sammelbuchungen und vorhandene Salden. Die Datei muss zum gewählten Bankkonto gehören.</p>

  <div class="section-body">
    <div class="row"> 
      <div class="form-column col-sm-6">
        <p><label for="input_file">Bankdatei (CAMT XML oder ZIP)</label> <input type="file" id="input_file" accept=".xml,.zip" /></p>
        <p>
            <label for="bank_account">Bankkonto</label>
            <select id="bank_account" class="form-control">
                <option value="">Bitte Bankkonto auswählen …</option>
            </select>
            <input id="intermediate_account" class="hidden" />
            <input id="company" class="hidden" />
            <input id="receivable_account" class="hidden" />
            <input id="payable_account" class="hidden" />
            <input id="expense_payable_account" class="hidden" />
            <input id="default_customer" class="hidden" />
            <input id="default_supplier" class="hidden" />
            <input id="auto_process_matches" class="hidden" />
      </p>
      </div>

      <div class="form-column col-sm-6" style="text-align: right; ">	  	
        <br><button type="submit" id="btn-parse-file" class="btn btn-sm btn-primary btn-parse-file">Einlesen</button>

      </div>
    </div>
      
    <div class="row">
        <div class="col-sm-12">
        <div id="table_placeholder"></div>	    
    </div>
    </div>
  </div>
  
</div>

<div id="waitingScreen" class="overlay hidden" role="status" aria-live="polite">
  <!-- Overlay content -->
  <div class="overlay-content">
    <p><i class="fa fa-spinner fa-spin" style="font-size:80px"></i></p>
    <p>Bankdatei wird vollständig geprüft …</p>
    <div class="" id="zipcontent"></div>
  </div>
</div>
